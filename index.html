<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Month Strict 2-Nap Baby Tracker</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --nap-color: #0984e3;
            --feed-color: #00b894;
            --play-color: #fdcb6e;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2d3436;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        h1 { text-align: center; color: var(--primary); margin: 0 0 5px 0; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 25px; font-size: 0.95rem; }
        
        .setup-box {
            background: #f1f2f6;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group:last-child { margin-bottom: 0; }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: white;
        }
        select:focus, input:focus {
            border-color: var(--primary);
            outline: none;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .timeline {
            margin-top: 25px;
            border-left: 4px solid #e2e8f0;
            padding-left: 20px;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 20px;
            padding-bottom: 5px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -28px;
            top: 6px;
            width: 12px;
            height: 12px;
            background: #b2bec3;
            border: 4px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 2px #b2bec3;
        }
        
        .item-wake::before, .item-bed::before { background: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
        .item-nap::before { background: var(--nap-color); box-shadow: 0 0 0 2px var(--nap-color); }
        .item-feed::before { background: var(--feed-color); box-shadow: 0 0 0 2px var(--feed-color); }
        .item-play::before { background: var(--play-color); box-shadow: 0 0 0 2px var(--play-color); }

        .time-badge { font-weight: bold; font-size: 1rem; }
        .item-wake .time-badge, .item-bed .time-badge { color: var(--primary); }
        .item-nap .time-badge { color: var(--nap-color); }
        .item-feed .time-badge { color: var(--feed-color); }
        .item-play .time-badge { color: #e17055; }

        .alert {
            background-color: #e8f4fd;
            border-left: 4px solid var(--nap-color);
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👶 Baby Tracker</h1>
    <div class="subtitle">Strict 2-Nap Schedule (Optimized for 8 Months)</div>
    
    <div class="setup-box">
        <div class="form-group">
            <label for="wakeTime">☀️ Morning Wake Up Time:</label>
            <input type="time" id="wakeTime" value="07:00">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="nap1Duration">⏱️ Nap 1 Actual Duration:</label>
                <select id="nap1Duration">
                    <option value="30">Short Nap (30 mins)</option>
                    <option value="45">45 mins</option>
                    <option value="75" selected>Good Nap (75 mins)</option>
                    <option value="90">Long Nap (90 mins)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="nap2Duration">⏱️ Nap 2 Expected Duration:</label>
                <select id="nap2Duration">
                    <option value="30">Short Nap (30 mins)</option>
                    <option value="45">45 mins</option>
                    <option value="75" selected>Good Nap (75 mins)</option>
                    <option value="90">Long Nap (90 mins)</option>
                </select>
            </div>
        </div>
    </div>

    <div id="scheduleOutput"></div>
</div>

<script>
    const wakeInput = document.getElementById('wakeTime');
    const nap1Select = document.getElementById('nap1Duration');
    const nap2Select = document.getElementById('nap2Duration');
    const outputDiv = document.getElementById('scheduleOutput');

    function formatTime(totalMinutes) {
        let mins = totalMinutes % 1440;
        let hours = Math.floor(mins / 60);
        let m = mins % 60;
        let ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return `${hours}:${m.toString().padStart(2, '0')} ${ampm}`;
    }

    function parseTimeToMinutes(timeString) {
        const [h, m] = timeString.split(':').map(Number);
        return (h * 60) + m;
    }

    function generateSchedule() {
        let morningWake = parseTimeToMinutes(wakeInput.value);
        let nap1Min = parseInt(nap1Select.value);
        let nap2Min = parseInt(nap2Select.value);
        
        let timeline = [];
        let isShortNap1 = nap1Min <= 30;

        // --- CYCLE 1: MORNING ---
        timeline.push({ time: morningWake, type: 'item-wake', text: '<strong>Morning Wake Up!</strong> Open blinds for natural light.' });
        timeline.push({ time: morningWake + 15, type: 'item-feed', text: '🥛 <strong>Milk Feed 1</strong>' });
        timeline.push({ time: morningWake + 60, type: 'item-feed', text: '🥣 <strong>Solids Breakfast</strong> + Highchair play.' });
        timeline.push({ time: morningWake + 90, type: 'item-play', text: '🌳 <strong>Activity:</strong> Outdoor stroller walk or active floor play.' });

        // --- NAP 1 ---
        // 8-Month Wake Window 1 is a steady 2.5 hours (150 mins)
        let nap1Start = morningWake + 150; 
        let nap1End = nap1Start + nap1Min;
        timeline.push({ time: nap1Start, endTime: nap1End, type: 'item-nap', text: `💤 <strong>Nap 1</strong>` });

        // --- CYCLE 2: MIDDAY ---
        timeline.push({ time: nap1End + 15, type: 'item-feed', text: '🥛 <strong>Milk Feed 2</strong>' });
        timeline.push({ time: nap1End + 75, type: 'item-feed', text: '🥣 <strong>Solids Lunch</strong>' });
        timeline.push({ time: nap1End + 90, type: 'item-play', text: '🧩 <strong>Activity:</strong> Stacking cups, tummy time, or structural toys.' });

        // --- NAP 2 ---
        // Normal Window 2 is 3 hours (180 mins). If Nap 1 was a short 30 min burst, build-up pressure 
        // means baby can only handle 2.5 hours (150 mins) before Nap 2 to avoid a total meltdown.
        let window2 = isShortNap1 ? 150 : 180;
        let nap2Start = nap1End + window2;
        let nap2End = nap2Start + nap2Min;
        timeline.push({ time: nap2Start, endTime: nap2End, type: 'item-nap', text: `💤 <strong>Nap 2</strong>` });

        // --- CYCLE 3: AFTERNOON & EVENING ---
        timeline.push({ time: nap2End + 15, type: 'item-feed', text: '🥛 <strong>Milk Feed 3</strong>' });
        timeline.push({ time: nap2End + 60, type: 'item-play', text: '🎵 <strong>Activity:</strong> Low-key floor play or reading books together.' });

        // --- BEDTIME (The Dynamic Adjustment) ---
        // A normal wake window before bed is 3.5 hours (210 mins).
        // If Nap 1 was short, we slightly reduce the final window to 3.25 hours (195 mins) 
        // to naturally bring bedtime earlier without breaking the 2-nap routine.
        let finalWindow = isShortNap1 ? 195 : 210;
        let bedtimeStart = nap2End + finalWindow;

        timeline.push({ time: bedtimeStart - 60, type: 'item-feed', text: '🥣 <strong>Solids Dinner</strong>' });
        timeline.push({ time: bedtimeStart - 30, type: 'item-feed', text: '🥛 <strong>Final Milk Top-up</strong> & Bedtime Routine (Bath, PJs).' });
        timeline.push({ time: bedtimeStart, type: 'item-bed', text: '🌙 <strong>Bedtime!</strong> Sweet dreams.' });

        // Sort items chronologically
        timeline.sort((a, b) => a.time - b.time);

        // Build HTML output
        let html = `<h3>Updated 2-Nap Schedule Timeline</h3><div class="timeline">`;
        timeline.forEach(item => {
            let displayTime = formatTime(item.time);
            if (item.endTime) displayTime += ` - ${formatTime(item.endTime)}`;
            html += `<div class="timeline-item ${item.type}"><span class="time-badge">${displayTime}</span> — ${item.text}</div>`;
        });
        html += `</div>`;

        if (isShortNap1) {
            html += `<div class="alert">🔄 <strong>8-Month Nap Strategy Adjusted:</strong> Nap 1 was short, so the tracker has safely shortened wake windows and pulled bedtime earlier to keep your baby rested without using a 3rd nap.</div>`;
        }

        outputDiv.innerHTML = html;
    }

    wakeInput.addEventListener('input', generateSchedule);
    nap1Select.addEventListener('change', generateSchedule);
    nap2Select.addEventListener('change', generateSchedule);
    generateSchedule();
</script>

</body>
</html>
