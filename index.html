<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Sleep Planner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-top: 0;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: 600;
            display: block;
            margin: 15px 0 5px;
            color: #4a5568;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fff;
        }
        button {
            width: 100%;
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        .schedule-table {
            margin-top: 25px;
            width: 100%;
            border-collapse: collapse;
            display: none;
        }
        .schedule-table th, .schedule-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        .schedule-table th {
            background-color: #ebf8ff;
            color: #2b6cb0;
        }
        .tip {
            margin-top: 15px;
            padding: 12px;
            background-color: #fffaf0;
            border-left: 4px solid #dd6b20;
            border-radius: 4px;
            font-size: 14px;
            display: none;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👶 Baby Sleep Planner</h1>
    
    <label for="babyAge">Baby's Age:</label>
    <select id="babyAge" onchange="handleAgeChange()">
        <option value="4-6">4 - 6 Months (3 Naps)</option>
        <option value="7-9" selected>7 - 9 Months (2 Naps)</option>
        <option value="10-12">10 - 12 Months (2 Naps)</option>
        <option value="13-18">13 - 18 Months (1 Nap transition)</option>
    </select>

    <label for="nap1End">When did the first nap end?</label>
    <input type="time" id="nap1End" value="09:50">

    <button onclick="calculateSchedule()">Generate Schedule</button>

    <table class="schedule-table" id="scheduleTable">
        <thead>
            <tr>
                <th>Time</th>
                <th>Event</th>
            </tr>
        </thead>
        <tbody id="scheduleBody">
        </tbody>
    </table>

    <div class="tip" id="sleepTip"></div>
</div>

<script>
    function parseTime(timeStr) {
        const [hours, minutes] = timeStr.split(':').map(Number);
        const date = new Date();
        date.setHours(hours, minutes, 0, 0);
        return date;
    }

    function formatTime(date) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    function addMinutes(date, minutes) {
        return new Date(date.getTime() + minutes * 60000);
    }

    function handleAgeChange() {
        // Clear old results when age updates to avoid confusion
        document.getElementById('scheduleTable').style.display = 'none';
        document.getElementById('sleepTip').style.display = 'none';
    }

    function calculateSchedule() {
        const nap1EndStr = document.getElementById('nap1End').value;
        if (!nap1EndStr) return;

        const nap1End = parseTime(nap1EndStr);
        const ageGroup = document.getElementById('babyAge').value;
        
        let htmlRows = `<tr><td><b>${formatTime(nap1End)}</b></td><td>Wake up from Nap 1</td></tr>`;
        let tipText = "";

        if (ageGroup === "4-6") {
            // 3-nap schedule structure
            const nap2Start = addMinutes(nap1End, 135); // 2.25 hr window
            const nap2End = addMinutes(nap2Start, 60);   // 1 hr nap
            const nap3Start = addMinutes(nap2End, 135); // 2.25 hr window
            const nap3End = addMinutes(nap3Start, 30);   // 30 min catnap
            const bedtime = addMinutes(nap3End, 150);    // 2.5 hr window before bed

            htmlRows += `
                <tr><td><b>${formatTime(nap2Start)} - ${formatTime(nap2End)}</b></td><td>🎨 Nap 2 (Aim for 1 hr)</td></tr>
                <tr><td><b>${formatTime(nap3Start)} - ${formatTime(nap3End)}</b></td><td>🧸 Nap 3 (30 min bridge catnap)</td></tr>
                <tr><td><b>${formatTime(bedtime)}</b></td><td>🌙 Bedtime</td></tr>
            `;
            tipText = "At 4-6 months, keep the last wake window short (around 2.5 hours) and use a brief 30-minute third nap just to bridge the gap to bedtime.";

        } else if (ageGroup === "7-9") {
            // 2-nap schedule structure (Standard 8 month rule)
            const nap2Start = addMinutes(nap1End, 180); // 3 hr window
            const nap2End = addMinutes(nap2Start, 90);   // 1.5 hr nap
            const bedtime = addMinutes(nap2End, 240);    // 4 hr window

            htmlRows += `
                <tr><td><b>${formatTime(nap2Start)} - ${formatTime(nap2End)}</b></td><td>🎨 Nap 2 (Aim for 1.5 hrs)</td></tr>
                <tr><td><b>${formatTime(bedtime)}</b></td><td>🌙 Bedtime</td></tr>
            `;
            tipText = `If Nap 2 finishes earlier than expected, track a 3.5 to 4-hour window from the actual wake time to set your bedtime. Avoid letting them sleep past 3:30 PM.`;

        } else if (ageGroup === "10-12") {
            // 2-nap mature schedule structure
            const nap2Start = addMinutes(nap1End, 210); // 3.5 hr window
            const nap2End = addMinutes(nap2Start, 60);   // 1 hr nap
            const bedtime = addMinutes(nap2End, 240);    // 4 hr window

            htmlRows += `
                <tr><td><b>${formatTime(nap2Start)} - ${formatTime(nap2End)}</b></td><td>🎨 Nap 2 (Aim for 1 hr)</td></tr>
                <tr><td><b>${formatTime(bedtime)}</b></td><td>🌙 Bedtime</td></tr>
            `;
            tipText = "Older babies can handle longer morning wake windows (3.5 hours). Keep bedtime locked at 4 hours after they wake up from their final afternoon nap.";

        } else if (ageGroup === "13-18") {
            // 1-nap schedule structure
            const bedtime = addMinutes(nap1End, 300); // 5 hr window after a long midday nap

            htmlRows = `
                <tr><td><b>${formatTime(nap1End)}</b></td><td>Wake up from the Main Midday Nap</td></tr>
                <tr><td><b>${formatTime(bedtime)}</b></td><td>🌙 Bedtime</td></tr>
            `;
            tipText = "On a 1-nap schedule, that single midday nap ideally needs to be 2 hours long. Aim for a solid 5-hour wake window between waking up from that nap and going to sleep for the night.";
        }

        // Render everything to the user screen
        document.getElementById('scheduleBody').innerHTML = htmlRows;
        document.getElementById('scheduleTable').style.display = 'table';
        
        const tipDiv = document.getElementById('sleepTip');
        tipDiv.innerHTML = `<strong>💡 Pro-Tip:</strong> ${tipText}`;
        tipDiv.style.display = 'block';
    }
</script>

</body>
</html>
