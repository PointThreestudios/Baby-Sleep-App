<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Baby Nap Planner</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2d3436;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        h1 { text-align: center; color: var(--primary); margin-top: 0; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            border-color: var(--primary);
            outline: none;
        }
        .timeline {
            margin-top: 30px;
            border-left: 4px solid #e2e8f0;
            padding-left: 20px;
            position: relative;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 25px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -28px;
            top: 4px;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border: 4px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 2px var(--primary);
        }
        .time-badge {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.1em;
        }
        .nap-modifier {
            display: inline-block;
            width: auto;
            padding: 4px 8px;
            margin-left: 10px;
            font-size: 14px;
        }
        .alert {
            background-color: #ffeaa7;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👶 Nap Planner</h1>
    
    <div class="form-group">
        <label for="ageRange">Baby's Age Range:</label>
        <select id="ageRange">
            <option value="4-6">4 - 6 Months (3 Naps)</option>
            <option value="6-9" selected>6 - 9 Months (2-3 Naps - *8 Months*)</option>
            <option value="9-12">9 - 12 Months (2 Naps)</option>
            <option value="12-18">12 - 18 Months (1-2 Naps)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="wakeTime">Morning Wake Up Time:</label>
        <input type="time" id="wakeTime" value="07:00">
    </div>

    <hr style="border: 0; border-top: 2px solid #e2e8f0; margin: 25px 0;">

    <div id="scheduleOutput">
        <!-- Generated Timeline Renders Here -->
    </div>
</div>

<script>
    // Configuration data for age-based wake windows (in minutes)
    const ageConfigs = {
        "4-6": { windows: [120, 135, 135, 150], defaultNap: 60, maxNaps: 3 },
        "6-9": { windows: [150, 180, 180, 180], defaultNap: 75, maxNaps: 3 }, // 8 month tier
        "9-12": { windows: [180, 210, 240], defaultNap: 90, maxNaps: 2 },
        "12-18": { windows: [240, 270], defaultNap: 120, maxNaps: 1 }
    };

    // State object to hold overridden nap lengths
    let actualNapLengths = {};

    const ageSelect = document.getElementById('ageRange');
    const wakeInput = document.getElementById('wakeTime');
    const outputDiv = document.getElementById('scheduleOutput');

    // Helper to format minutes from midnight to HH:MM AM/PM
    function formatTime(totalMinutes) {
        let mins = totalMinutes % 1440;
        let hours = Math.floor(mins / 60);
        let m = mins % 60;
        let ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12; // 0 should be 12
        return `${hours}:${m.toString().padStart(2, '0')} ${ampm}`;
    }

    // Helper to parse "HH:MM" into total minutes from midnight
    function parseTimeToMinutes(timeString) {
        const [h, m] = timeString.split(':').map(Number);
        return (h * 60) + m;
    }

    function generateSchedule() {
        const age = ageSelect.value;
        const config = ageConfigs[age];
        let currentTime = parseTimeToMinutes(wakeInput.value);
        
        let html = `<h3>Daily Plan Timeline</h3><div class="timeline">`;
        html += `<div class="timeline-item"><span class="time-badge">${formatTime(currentTime)}</span> — ☀️ Good Morning! Wake up.</div>`;

        let napCount = config.maxNaps;
        let shortNapDetected = false;

        for (let i = 0; i < napCount; i++) {
            // Fetch configuration wake window
            let window = config.windows[i] || config.windows[config.windows.length - 1];
            
            // Adjust window if the previous nap was exceptionally short (< 45 mins)
            if (i > 0 && actualNapLengths[i] < 45) {
                window = Math.max(window - 30, 90); // Shorten wake window by 30 mins, min 1.5h
                shortNapDetected = true;
            }

            // Calculate Nap Start
            currentTime += window;
            const napStart = currentTime;

            // Fetch actual length or fall back to default setting
            const napId = i + 1;
            if (actualNapLengths[napId] === undefined) {
                actualNapLengths[napId] = config.defaultNap;
            }
            const duration = actualNapLengths[napId];

            // Calculate Nap End
            currentTime += duration;
            const napEnd = currentTime;

            html += `
            <div class="timeline-item">
                <span class="time-badge">${formatTime(napStart)} - ${formatTime(napEnd)}</span> — 💤 <strong>Nap ${napId}</strong>
                <br>
                <label style="display:inline; font-size:14px; font-weight:normal;">Actual Duration: </label>
                <input type="number" class="nap-modifier" data-nap="${napId}" value="${duration}" min="0" max="180" style="width:70px; padding:3px;"> mins
            </div>`;

            // If a 2-nap schedule turns messy due to a tiny short nap, dynamically suggest a bridge catnap
            if (config.maxNaps === 2 && duration <= 30 && i === 0 && napCount === 2) {
                napCount = 3; // Dynamically add a 3rd nap block to prevent massive bedtime gap
            }
        }

        // Final Bedtime calculation
        let finalWindow = config.windows[napCount] || config.windows[config.windows.length - 1];
        currentTime += finalWindow;

        html += `<div class="timeline-item"><span class="time-badge">${formatTime(currentTime)}</span> — 🌙 <strong>Bedtime Routine</strong></div>`;
        html += `</div>`;

        if (shortNapDetected) {
            html += `<div class="alert">⚠️ <strong>Note:</strong> Subsequent wake windows were compressed due to a short nap to prevent overtiredness.</div>`;
        }

        outputDiv.html = html; // Wait, layout framework safety assignment:
        outputDiv.innerHTML = html;

        // Re-attach event listeners to the dynamic input boxes
        document.querySelectorAll('.nap-modifier').forEach(input => {
            input.addEventListener('change', (e) => {
                const napId = e.target.getAttribute('data-nap');
                actualNapLengths[napId] = parseInt(e.target.value) || 0;
                generateSchedule();
            });
        });
    }

    // Event listeners for base configurations
    ageSelect.addEventListener('change', () => {
        actualNapLengths = {}; // reset specific modifications when changing age tiers
        generateSchedule();
    });
    wakeInput.addEventListener('change', generateSchedule);

    // Initial render run
    generateSchedule();
</script>

</body>
</html>
